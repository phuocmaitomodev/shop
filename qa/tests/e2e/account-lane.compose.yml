name: ${ACCOUNT_E2E_PROJECT_NAME:?Set a unique ACCOUNT_E2E_PROJECT_NAME for this run}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: account_e2e
      POSTGRES_USER: account_e2e
      POSTGRES_PASSWORD: account-e2e-only
    ports:
      - "127.0.0.1:${ACCOUNT_E2E_POSTGRES_PORT:-15432}:5432"
    volumes:
      - account_e2e_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_e2e -d account_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 3s

  migrate:
    build:
      context: ../../../backend
      target: runtime
    environment: &api-environment
      APP_ENV: test
      APP_SECRET_KEY: account-e2e-only-secret-not-for-production
      DATABASE_URL: postgresql+asyncpg://account_e2e:account-e2e-only@db:5432/account_e2e
      CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:${ACCOUNT_E2E_FRONTEND_PORT:-15176}"]'
      AUTH_COOKIE_NAME: shop_account_e2e_session
      AUTH_COOKIE_SECURE: "false"
      AUTH_RATE_LIMIT_ATTEMPTS: "100"
      RAG_EMBEDDING_PROVIDER: stub
      RAG_CHAT_PROVIDER: stub
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ../../../backend
      target: runtime
    environment: *api-environment
    ports:
      - "127.0.0.1:${ACCOUNT_E2E_API_PORT:-18002}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ../../../frontend
      target: development
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:${ACCOUNT_E2E_API_PORT:-18002}/api/v1
    ports:
      - "127.0.0.1:${ACCOUNT_E2E_FRONTEND_PORT:-15176}:5176"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5176').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  account_e2e_postgres:

networks:
  default:
    ipam:
      config:
        - subnet: ${ACCOUNT_E2E_SUBNET:-10.252.27.0/24}
