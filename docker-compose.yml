services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:5176"]}
      AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-7}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-shop_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_RATE_LIMIT_MAX_KEYS: ${AUTH_RATE_LIMIT_MAX_KEYS:-10000}
      FORGOT_RESPONSE_FLOOR_MS: ${FORGOT_RESPONSE_FLOOR_MS:-250}
      CHAT_RATE_LIMIT_REQUESTS: ${CHAT_RATE_LIMIT_REQUESTS:-30}
      CHAT_RATE_LIMIT_WINDOW_SECONDS: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:-60}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-stub}
      RAG_CHAT_PROVIDER: ${RAG_CHAT_PROVIDER:-stub}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      RAG_KNOWLEDGE_TOP_K: ${RAG_KNOWLEDGE_TOP_K:-3}
      RAG_KNOWLEDGE_CANDIDATE_LIMIT: ${RAG_KNOWLEDGE_CANDIDATE_LIMIT:-20}
      RAG_KNOWLEDGE_SIMILARITY_THRESHOLD: ${RAG_KNOWLEDGE_SIMILARITY_THRESHOLD:-0.2}
      RAG_KNOWLEDGE_RRF_K: ${RAG_KNOWLEDGE_RRF_K:-60}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  migration-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      APP_ENV: test
      APP_SECRET_KEY: migration-test-only-secret
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      MIGRATION_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      RAG_KNOWLEDGE_TOP_K: ${RAG_KNOWLEDGE_TOP_K:-3}
      RAG_KNOWLEDGE_CANDIDATE_LIMIT: ${RAG_KNOWLEDGE_CANDIDATE_LIMIT:-20}
      RAG_KNOWLEDGE_SIMILARITY_THRESHOLD: ${RAG_KNOWLEDGE_SIMILARITY_THRESHOLD:-0.2}
      RAG_KNOWLEDGE_RRF_K: ${RAG_KNOWLEDGE_RRF_K:-60}
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "pytest",
        "-W",
        "error",
        "tests/integration/test_postgres_migrations.py",
        "tests/integration/test_return_policy_lifecycle_postgres.py",
        "tests/integration/test_product_projection_postgres.py",
        "tests/test_rag_index_postgres.py",
        "tests/integration/test_knowledge_retrieval_postgres.py",
        "tests/integration/test_product_retrieval_postgres.py",
        "-v",
      ]

  rag-worker:
    build:
      context: ./backend
      target: runtime
    command: ["python", "-m", "app.rag.run_worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-stub}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      RAG_WORKER_LOCK_TIMEOUT_SECONDS: ${RAG_WORKER_LOCK_TIMEOUT_SECONDS:-300}
      RAG_WORKER_PROVIDER_TIMEOUT_SECONDS: ${RAG_WORKER_PROVIDER_TIMEOUT_SECONDS:-120}
      RAG_WORKER_MAX_ATTEMPTS: ${RAG_WORKER_MAX_ATTEMPTS:-5}
      RAG_WORKER_RETRY_BASE_SECONDS: ${RAG_WORKER_RETRY_BASE_SECONDS:-5}
      RAG_WORKER_RETRY_MAX_SECONDS: ${RAG_WORKER_RETRY_MAX_SECONDS:-300}
      RAG_WORKER_POLL_SECONDS: ${RAG_WORKER_POLL_SECONDS:-2}
      RAG_WORKER_HEALTH_MAX_AGE_SECONDS: ${RAG_WORKER_HEALTH_MAX_AGE_SECONDS:-150}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "app.rag.healthcheck",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: ${RAG_WORKER_STOP_GRACE_PERIOD:-130s}

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5176}:5176"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5176').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
